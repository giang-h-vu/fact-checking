# Run `uv tool install pre-commit`  to install
# Run `pre-commit install`once to wire these into your local git hooks.
# Run on demand with `pre-commit run --all-files`.
#
# Two kinds of hook below:
#   - CHECKERS report problems and leave files untouched (check-yaml, actionlint).
#   - FIXERS rewrite files in place, then fail the commit so you re-stage them
repos:
  # Generic checks + small fixers (all files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml # syntax-validate every YAML file (checker)
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer # fixer: ensure trailing newline
      - id: trailing-whitespace # fixer: strip trailing whitespace

  # GitHub Actions semantic lint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  #   - ruff       <- server/uv.lock
  #   - prettier   <- web-client/package-lock.json
  - repo: local
    hooks:
      # Exclude generated models
      # lint with autofix
      - id: ruff-check
        name: ruff (lint --fix)
        entry: uv run --project server ruff check --fix
        language: system
        files: ^server/
        exclude: ^server/app/api/generated/
        types: [python]
        # server formatter
      - id: ruff-format
        name: ruff-format
        entry: uv run --project server ruff format
        language: system
        files: ^server/
        exclude: ^server/app/api/generated/
        types: [python]
        # typecheck the whole app package
      - id: mypy
        name: mypy
        entry: bash -c 'cd server && uv run mypy app'
        language: system
        files: ^server/
        # mypy needs whole-package analysis
        pass_filenames: false

        # Fix formatting with prettier for web-client
      - id: prettier # YAML + TS/TSX/CSS/JSON
        name: prettier
        entry: web-client/node_modules/.bin/prettier --write
        language: system
        files: '\.(ya?ml)$|^web-client/.*\.(ts|tsx|css|json|js|jsx)$'
        exclude: ^web-client/src/api\.ts$
