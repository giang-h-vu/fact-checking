name: Deploy

# On-demand promotion pipeline: gate on CI + real-API tool tests, build & push
# immutable images, then roll them out to the AKS cluster.
#     ci  ->  test-tools  ->  build-images  ->  deploy
# Triggers: a v* tag, a published release, or a manual run.
# Images are built for deployment, not on every commit.
on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Never cancel an in-flight deploy.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  AKS_CLUSTER: ${{ vars.AKS_CLUSTER }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:
  # Re-run the full CI workflow against THIS commit.
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  # 2) Real-external-API tool tests. Runs on every deploy trigger
  test-tools:
    needs: ci
    uses: ./.github/workflows/test-tools.yaml
    secrets: inherit

  # 3) Build & push immutable images. The `sha-<full-sha>` tag is always pushed
  #    (deterministic across all triggers); semver + :latest are added on tags.
  build-images:
    name: Build and push images
    needs: [ci, test-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: server
            context: server
          - service: web-client
            context: web-client
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name automatically.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fact-checking-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 4) Roll the exact built images out to AKS. The cluster is normally stopped.
  #    Authenticate with OIDC, start it only if needed,
  #    Pin the deployments to the immutable sha/tag that is just pushed.
  deploy:
    name: Deploy to AKS
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15 # guardrail: ~5m start + rollout;
    environment: production # gated approval + scoped secrets (configure in repo Settings)
    permissions:
      id-token: write # mint the OIDC token for azure/login
      contents: read
    steps:
      - uses: actions/checkout@v5 # need infra/k8s/app for `kubectl apply -k`

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure cluster is running
        run: ./infra/scripts/ensure-cluster-running.sh

      - name: Get kubeconfig
        run: az aks get-credentials -n "$AKS_CLUSTER" -g "$AKS_RESOURCE_GROUP" --overwrite-existing

      - name: Wait for nodes
        run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      # Pin the app overlay to the built images, then apply.
      # `kustomize edit set image` rewrites the local kustomization
      # creates app resources if missing, updates them otherwise.
      # Stateful infra (PVCs, Gateway, Ollama, secrets, namespace) is NOT touched here
      # First deploy requires bootstrap to have run
      - name: Roll out images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA}"
          cd infra/k8s/app
          kustomize edit set image \
            "fact-checking-server=${REGISTRY}/${owner}/fact-checking-server:${tag}" \
            "fact-checking-web=${REGISTRY}/${owner}/fact-checking-web-client:${tag}"
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/server -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/web -n "$K8S_NAMESPACE" --timeout=180s
