openapi: 3.1.0
info:
  title: Fact Checking API
  version: 1.0.0
  description: |
    Agent-driven fact-checking service. A claim is routed through three LangGraph
    agents (document search → evidence retrieval → claim verification) and the
    pipeline streams progress to clients over Server-Sent Events.

    Source of truth — do not duplicate this spec inside any service. Both the
    FastAPI backend and the React frontend are generated from this file
    (see /api/codegen.sh).
  contact:
    name: Fact Checking Tool
servers:
  - url: http://localhost:8000
    description: Local dev
tags:
  - name: auth
    description: Google OAuth login and session management
  - name: verify
    description: Real-time claim verification (SSE)
  - name: history
    description: Past verification requests

paths:
  /api/v1/auth/google/login:
    get:
      tags: [auth]
      operationId: authGoogleLogin
      summary: Begin Google OAuth — redirect the browser to Google's consent screen
      responses:
        "302":
          description: Redirect to Google's OAuth 2.0 authorization endpoint
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/google/callback:
    get:
      tags: [auth]
      operationId: authGoogleCallback
      summary: Google OAuth callback — exchange code, set session cookies, redirect home
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
      responses:
        "302":
          description: |
            Authentication succeeded. Sets httpOnly `access_token` and
            `refresh_token` cookies and redirects to the frontend.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token and mint a fresh access token
      description: |
        Reads the httpOnly `refresh_token` cookie, rotates it (the old token is
        revoked and a new one issued), and sets a new `access_token` cookie.
      responses:
        "204":
          description: New `access_token` and `refresh_token` cookies set
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the current refresh token and clear session cookies
      responses:
        "204":
          description: Session cookies cleared
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Return the currently authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/verify:
    post:
      tags: [verify]
      operationId: streamVerify
      security:
        - cookieAuth: []
      summary: Verify a claim and stream agent progress over SSE
      description: |
        Returns `text/event-stream`. The stream emits the following named
        events in order; clients should parse `event:` and JSON-decode `data:`.
        The `data` payload of each event is described by the referenced schema.

        | event            | data schema             |
        |------------------|-------------------------|
        | search_started   | `SearchStartedPayload`  |
        | candidates_found | `CandidatesFoundPayload`|
        | passage_found    | `PassageFoundPayload`   |
        | passage_verdict  | `PassageVerdictPayload` |
        | final_verdict    | `FinalVerdictPayload`   |
        | done             | `{}`                    |
        | error            | `Error`                 |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: SSE stream of agent progress events
          content:
            text/event-stream:
              schema:
                type: string
                description: "Concatenated SSE frames (event/data lines per WHATWG HTML Living Standard §9.2)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/history:
    get:
      tags: [history]
      operationId: listHistory
      summary: List recent verification requests
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Most recent verification requests, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived access-token JWT stored in an httpOnly cookie.

  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        picture: { type: string, format: uri }

    VerifyRequest:
      type: object
      required: [claim]
      properties:
        claim:
          type: string
          minLength: 1
          maxLength: 1000
          description: The natural-language statement to verify
        prefer_source:
          type: string
          enum: [auto, wiki, web]
          description: "Source preference for the verification request. `auto` lets the agent decide. Omit or send null to use auto."

    Verdict:
      type: string
      enum: [SUPPORTED, REFUTED, NOT_ENOUGH_INFO]

    SseEventType:
      type: string
      enum:
        - search_started
        - candidates_found
        - passage_found
        - passage_verdict
        - final_verdict
        - done
        - error

    SearchCandidate:
      type: object
      required: [url, title, source]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        snippet: { type: string }
        source: { type: string, enum: [duckduckgo, brave, wikipedia] }

    Citation:
      type: object
      required: [url, title, passage, label]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        passage: { type: string }
        label: { $ref: "#/components/schemas/Verdict" }
        reasoning: { type: string }

    HistoryItem:
      type: object
      required: [id, claim, datetime, verdict]
      properties:
        id: { type: integer }
        claim: { type: string }
        datetime: { type: string, format: date-time }
        verdict: { $ref: "#/components/schemas/Verdict" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }

    HistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    # --- SSE event payloads ---------------------------------------------------
    # The `data` JSON of each named SSE event.
    # These exist so both ends generate the wire shapes
    # Do not reuse them as internal pipeline state.
    SearchStartedPayload:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          items: { type: string }

    CandidatesFoundPayload:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchCandidate" }

    PassageFoundPayload:
      type: object
      required: [url, title, passage]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        passage: { type: string }

    PassageVerdictPayload:
      type: object
      required: [url, label, reasoning]
      properties:
        url: { type: string, format: uri }
        label: { $ref: "#/components/schemas/Verdict" }
        reasoning: { type: string }

    FinalVerdictPayload:
      type: object
      required: [verdict, citations]
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Request body failed schema validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
