apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-route
spec:
  parentRefs:
    - name: fact-checking-gateway # Gateway lives in the bootstrap tier
  hostnames:
    - factchecking.dpdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api # all /api/* requests go to the FastAPI backend
      backendRefs:
        - name: server
          port: 8000
