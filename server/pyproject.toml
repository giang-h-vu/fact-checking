[project]
name = "fact-checking-backend"
version = "1.0.0"
description = "Agent-driven fact-checking backend (FastAPI + LangGraph + Ollama)"
authors = [{ name = "gvu", email = "vhgiang98@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  # Web layer
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.30.0,<0.31",
  "sse-starlette>=2.1.0,<3.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.5.0,<3.0",

  # Agent stack
  "langgraph>=0.2.30,<0.3",
  "langchain>=0.3.0,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "langchain-ollama>=0.2.0,<0.3",
  "langchain-community>=0.3.0,<0.4",

  # Tools
  "httpx>=0.27.0,<0.28",
  "trafilatura>=1.12.0,<2.0",
  "pymediawiki>=0.7.5,<0.8",
  "google-api-python-client>=2.140.0,<3.0",
  "tenacity>=9.0.0,<10.0",

  # Persistence
  "sqlmodel>=0.0.22,<0.1",
  "aiosqlite>=0.20.0,<0.21",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<0.25",
  "ruff>=0.6.0,<0.7",
  "datamodel-code-generator>=0.26.0",
  "mypy>=1.11.0,<2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*", "mediawiki", "googleapiclient", "googleapiclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
