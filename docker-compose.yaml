# Change the model here — it propagates to both the pull step and the server.
x-ollama-model: &ollama-model "qwen2.5:7b-instruct"

services:
  # ── LLM runtime ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Comment the deploy block out if nvidia-container-toolkit is not available.
    # Ollama falls back to CPU automatically; slower inference.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── One-shot: pulls the model into the volume if not already present ─────────
  ollama-pull:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      - ollama
      - pull
      - *ollama-model
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: *ollama-model
      DATABASE_URL: sqlite+aiosqlite:////app/data/fact_checking.db
      CORS_ORIGINS: http://localhost
      OAUTH_REDIRECT_URI: http://localhost/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost
    volumes:
      - server_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── React frontend (nginx) ───────────────────────────────────────────────────
  web:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  ollama_data: # persists downloaded models
  server_data: # persists the SQLite history database
